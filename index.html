     빼면 CSS 가 같은 파일을 한 번 더 받는다. -->
<link rel="preload" href="./assets/vendor/pretendard/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>

<body>

<div id="app" role="application" aria-label="AI 연수원"></div>

<!-- 스크린리더용 실시간 알림 영역 -->
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<!--
  file:// 로 직접 열면 브라우저가 보안 정책(CORS)으로 ES 모듈을 막는다.
  그때는 아래 안내가 뜬다. GitHub Pages 같은 주소로 열면 정상 동작한다.
-->
<noscript>
  <div class="boot-msg">
    <h1>자바스크립트가 꺼져 있습니다</h1>
    <p>브라우저 설정에서 자바스크립트를 켜고 새로고침해 주세요.</p>
  </div>
</noscript>

<div id="boot-fallback" class="boot-msg" hidden>
  <h1>파일을 직접 열면 실행되지 않습니다</h1>
  <p>브라우저 보안 정책 때문입니다. 아래 둘 중 하나로 열어 주세요.</p>
  <ol>
    <li><b>배포 주소로 열기</b> — 링크로 받은 주소를 그대로 열면 바로 됩니다</li>
    <li><b>이 폴더에서 <code>start.cmd</code> 실행</b> — 로컬에서 확인할 때만 필요합니다</li>
  </ol>
</div>

<script type="module" src="./src/main.js?v=9c1f5bc6"></script>
<script>
  // 모듈이 뜨지 않으면(대개 file:// 로 연 경우) 안내를 보여준다.
  setTimeout(function () {
    if (!document.documentElement.hasAttribute('data-booted')) {
      var el = document.getElementById('boot-fallback');
      if (el) el.hidden = false;
    }
  }, 1200);
</script>

</body>
</html>
